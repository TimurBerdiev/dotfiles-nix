onboarding = false
[keys]
prefix = "ctrl+a"
# Focus pane
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"
# Split
split_horizontal = "prefix+-"
split_vertical   = "prefix+|"
# Tabs
new_tab   = "prefix+c"
close_tab = "prefix+shift+x"
# Workspaces
workspace_picker = "prefix+w"
goto             = "prefix+g"
new_workspace    = "prefix+shift+n"
new_worktree     = "prefix+shift+g"
close_workspace  = "prefix+d"
# Panes
close_pane      = "prefix+x"
rename_pane     = "prefix+shift+p"
edit_scrollback = "prefix+e"
copy_mode       = "prefix+["
zoom            = "prefix+m"
resize_mode     = "prefix+z"
toggle_sidebar  = "prefix+b"
# Navigation
cycle_pane_next     = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
# Navigate mode (prefix+g): move between workspaces with j/k instead of arrows
navigate_workspace_up   = "k"
navigate_workspace_down = "j"
# j/k used to be pane navigation; shifted to ctrl+j/ctrl+k so they don't conflict
navigate_pane_up    = "ctrl+k"
navigate_pane_down  = "ctrl+j"
# Session
detach                 = "prefix+q"
open_notification_target = "prefix+o"
# Agent navigation
previous_agent = "prefix+p"
next_agent     = "prefix+n"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage plugins"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title"]]
